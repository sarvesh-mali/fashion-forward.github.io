<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact-page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="left-side">
                <div class="address details">
                    <i class="fa-solid fa-location-dot"></i>
                    <div class="detail">Address</div>
                    <div class="text-one">Lorem, ipsum.</div>
                    <div class="text-two">Lorem, ipsum dolor.</div>
                </div>

                <div class="Phone details">
                    <i class="fa-solid fa-phone"></i>
                    <div class="detail">Phone</div>
                    <div class="text-one">+9112345 67890</div>
                    <div class="text-two">+9178945 61230</div>
                </div>

                <div class="Email details">
                    <i class="fa-solid fa-envelope"></i>
                    <div class="detail">Email</div>
                    <div class="text-one">example1@gmail.com</div>
                    <div class="text-two">example2@gmail.com</div>
                </div>
            </div>

            <div class="right-side">
                <h3>Send Us Message</h3>
                <p>We would love to respond to your queries and help you succeed. <br>
                    Feel free to get in touch with us.
                </p>

                <form action="">
                    <div class="input-box">
                        <input type="text" placeholder="Enter Your Name" required>
                    </div>

                    <div class="input-box">
                        <input type="text" placeholder="Enter Your E-mail" required>
                    </div>

                    <div class="input-box message">
                        <textarea name="" id=""></textarea>
                    </div>

                    <div class="button">
                        <button>Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
